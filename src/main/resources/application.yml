spring:
  application:
    name: lab-service
  
  profiles:
    active: ${SPRING_PROFILE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medibridge_lab}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Prakash@1}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URL_DEV:redis://localhost:6379}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        jdbc:
          batch_size: 50

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS_DEV:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${spring.application.name}-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  server:
    port: ${SERVER_PORT:8084}

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:du1pyzthl}

  api-key: ${CLOUDINARY_API_KEY:451954261338871}
  api-secret: ${CLOUDINARY_API_SECRET:vL9wmoZn8Yid40FtSS1irqtT3N8}
  folder: ${CLOUDINARY_FOLDER:medibridge/lab-reports}
  secure: true

# Security (JWT Resource Server)
security:
  jwt:
    secret-key: ${JWT_SECRET:MediBridge2026!Dev$ecretK3y#Tes7Env@Secur1ty}

# Server
server:
  port: ${SERVER_PORT:8085}



# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true

logging:
  level:
    root: INFO
    com.medibridge: INFO
